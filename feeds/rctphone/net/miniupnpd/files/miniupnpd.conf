# miniupnpd.conf — EE71 secure configuration
# Built with miniupnpd 2.3.9, iptables firewall, IPv6

# WAN interface
ext_ifname=rmnet_data0

# LAN interface — must use interface name for IPv6 support
listening_ip=bridge0

# HTTP port for UPnP descriptions and SOAP
http_port=9966

# Enable UPnP and NAT-PMP
enable_upnp=yes
enable_natpmp=yes

# Secure mode: clients can only create mappings to their own IP
secure_mode=yes

# Lease file (volatile — lost on reboot, which is fine for UPnP)
lease_file=/var/volatile/upnp.leases

# Device identity
friendly_name=4GEE WiFi Mini
manufacturer_name=EE Limited
manufacturer_url=http://www.ee.co.uk
model_name=4GEE WiFi Mini
model_description=LTE mobile router
model_url=http://www.ee.co.uk
model_number=4GEE WiFi Mini
presentation_url=http://4gee.wifi/

# UUID (same as stock)
uuid=743eda24-5582-4a35-91bc-91ffca6db755

# Report system uptime
system_uptime=yes

# SSDP notify interval (seconds)
notify_interval=60

# Clean stale rules every 10 minutes
clean_ruleset_interval=600

# UPnP permission rules
# secure_mode=yes restricts to client's own IP regardless of ACL subnet
# Allow only unprivileged ports (1024+) on both sides
allow 1024-65535 0.0.0.0/0 1024-65535
# Deny everything else
deny 0-65535 0.0.0.0/0 0-65535
