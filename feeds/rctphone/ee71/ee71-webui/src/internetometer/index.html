<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Internet Speed Test</title>
<style>
@font-face{font-family:'YS Text';font-weight:400;font-display:swap;src:url(https://yastatic.net/s3/home/fonts/ys/1/text-regular.woff2) format('woff2')}
@font-face{font-family:'YS Text';font-weight:500;font-display:swap;src:url(https://yastatic.net/s3/home/fonts/ys/1/text-medium.woff2) format('woff2')}
:root{--i-color-text-secondary:#8a8a8e;--line:rgba(127,127,127,.18);--accent:#3d8b7a;--color-danger:#d63939;--color-info:#4299e1}
html[data-theme="light"]{--accent:#4d9e91}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#161617;color:#fff;font-family:'YS Text',-apple-system,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px}
html[data-theme="light"] body{background:#fff;color:#161617}
.speedometer{position:relative;margin-bottom:24px;--inner-text-color:var(--accent)}
.speedometer{margin-top:64px}
.speedometer{margin-top:48px}
.speedometer{margin-top:16px}
.speedometer__svg-container{position:relative}
.speedometer__svg{height:100%;width:261px}
.speedometer__svg{width:698px}
.speedometer__svg{width:957px}
.speedometer__svg .speed{opacity:0}
.speedometer__svg .speed.speedometer__svg-visible{opacity:1;-webkit-transition:all .2s ease-in-out;transition:all .2s ease-in-out;-webkit-transform:translateZ(0);transform:translateZ(0)}
.speedometer__svg_tablet{opacity:0}
.speedometer__svg_mobile{opacity:1}
.speedometer__svg_mobile{opacity:0}
.speedometer__svg_tablet{opacity:1}
.speedometer__svg_tablet{opacity:0}
.speedometer__svg_desktop{opacity:1}
.speedometer__svg_dynamic-svg{position:absolute;top:0;left:0}
.speedometer__container{position:absolute;top:0;left:0;width:100%;height:100%}
.speedometer__button{overflow:hidden}
.speedometer__button>.g-button__text{width:100%;height:100%}
.speedometer__button-inner{width:100%;height:100%;margin:15px 0 0}
.speedometer__button-inner{margin:0}
.speedometer__button-inner-text{white-space:normal;line-height:normal;width:250px;font-size:32px;-webkit-transition:color .15s linear;transition:color .15s linear}
.speedometer__button-inner-text{width:460px;font-size:64px}
.speedometer__button-inner-text{width:100%}
.speedometer__info{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden}
.speedometer__info-inner{width:100%;height:100%;-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;margin:15px 0 0}
.speedometer__info-inner{-webkit-box-orient:horizontal;-webkit-box-direction:normal;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;margin:0}
.speedometer__value-display{width:213px;text-align:center;margin:9px 0}
.speedometer__value-display{margin:0}
.speedometer__value-display__unit{font-size:15px;font-size:17px}
.speedometer__value-display__icon{position:relative;vertical-align:middle;bottom:1px;width:12px;height:12px}
.speedometer__value-display__icon{width:14px;height:14px}
.speedometer__value-display__icon_upload{-webkit-transform:scaleY(-1);-ms-transform:scaleY(-1);transform:scaleY(-1)}
.speedometer__value-display__value{line-height:100%;font-size:32px;margin:4px 0}
.speedometer__value-display__value{margin:8px 0;font-size:48px}
.speedometer__value-display__value{font-size:64px}
.speedometer__value-display__value_progress{color:var(--accent)}
.speedometer__value-display__value_initial{color:var(--i-color-text-secondary)}
.speedometer:hover .speedometer__button-inner-text{color:var(--inner-text-color)}
.speedometer:hover .speedometer__button-inner-text{color:currentColor}
.speedometer:active .speedometer__button-inner-text{color:var(--inner-text-color)}
.speedometer{margin-bottom:14px}
.speedometer{margin-top:4px}
.speedometer__svg{height:50vh}
.speedometer__button-inner-text{font-size:28px}
.speedometer__value-display__value{font-size:4vh}
.speedometer__value-display__unit{font-weight:500}
.speedometer__info-inner{grid-gap:32px}
.speedometer__info-inner{grid-gap:4px}
.speedometer__value-display__unit{font-size:var(--g-text-body-1-font-size);line-height:var(--g-text-body-1-line-height)}
.speedometer__value-display__unit{font-size:var(--g-text-body-short-font-size)}

#dial{display:block;width:100%;height:auto;fill:var(--accent)}
.speedometer__svg_tablet{opacity:1!important}
.s-stage{position:relative;width:520px;max-width:94vw}
.s-dyn{position:absolute;inset:0;width:100%;height:auto;pointer-events:none}
#ind{stroke:var(--accent)}
.s-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#go{font-family:inherit;font-size:34px;font-weight:500;color:#fff;background:none;border:0;cursor:pointer;padding:0;transition:color .15s}
#go:hover{color:var(--inner-text-color)}
#go[disabled]{cursor:default;opacity:.5}
.s-num{font-size:58px;font-weight:500;line-height:1;display:none}
.s-num small{font-size:17px;color:var(--i-color-text-secondary);font-weight:400}
.s-phase{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--i-color-text-secondary);margin-top:8px;min-height:1.1em}
.s-reads{display:flex;gap:28px;margin-top:20px}
.s-read{text-align:center}
.s-read .v{font-size:21px;font-weight:500}.s-read .v small{font-size:11px;color:var(--i-color-text-secondary);font-weight:400}
.s-read .l{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--i-color-text-secondary);margin-top:3px}
.s-read.on .v{color:var(--accent)}
.s-server{font-size:12px;color:var(--i-color-text-secondary);margin-top:14px;min-height:1.2em;text-align:center}
.s-server b{color:inherit;font-weight:500}
.s-info{width:520px;max-width:94vw;margin-top:26px}
.s-info h3{font-size:15px;font-weight:500;margin:0 0 8px}
.s-info .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.s-info .row .k{color:var(--i-color-text-secondary)}.s-info .row .val{text-align:right}
.s-restart{margin-top:18px;font-family:inherit;font-size:15px;font-weight:500;color:#fff;background:var(--accent);border:0;border-radius:22px;padding:11px 30px;cursor:pointer;display:none}
.s-restart:hover{filter:brightness(1.08)}
.s-alert{display:none;max-width:520px;width:94vw;margin:16px auto 0;padding:12px 16px;border-radius:10px;font-size:.95rem;line-height:1.35;text-align:center}.s-alert.show{display:block}.s-alert.danger{background:color-mix(in srgb,var(--color-danger) 14%,transparent);border:1px solid color-mix(in srgb,var(--color-danger) 40%,transparent);color:var(--color-danger)}.s-alert.info{background:color-mix(in srgb,var(--color-info) 14%,transparent);border:1px solid color-mix(in srgb,var(--color-info) 40%,transparent);color:var(--color-info)}
.s-result{display:none;gap:18px;align-items:flex-start;justify-content:center}
.s-result.show{display:flex}
.rc{text-align:center;min-width:66px}
.rc .rl{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--i-color-text-secondary)}
.rc .rv{font-size:27px;font-weight:600;line-height:1.1;margin-top:3px}
.rc .ru{font-size:11px;color:var(--i-color-text-secondary)}
</style></head>

    <svg class="s-dyn" width="652" height="392" viewBox="0 0 652 392" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path id="ind" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" d=""></path>
    </svg>
    <div class="s-center">
      <button id="go">Test</button>
      <div class="s-num" id="num">0<small> Mbps</small></div>
      <div class="s-phase" id="phase"></div>
      <div class="s-result" id="result">
        <div class="rc"><div class="rl">Download</div><div class="rv" id="rv-dl">&mdash;</div><div class="ru">Mbps</div></div>
        <div class="rc"><div class="rl">Upload</div><div class="rv" id="rv-ul">&mdash;</div><div class="ru">Mbps</div></div>
        <div class="rc"><div class="rl">Ping</div><div class="rv" id="rv-pg">&mdash;</div><div class="ru">ms</div></div>
      </div>
    </div>
  </div>
</div>
<div class="s-alert" id="alert" role="alert"></div>
<div class="s-server" id="server"></div>
<button class="s-restart" id="restart">Test again</button>
<div class="s-info">
  <h3>Your connection</h3>
  <div class="row"><span class="k">IPv4 address</span><span class="val" id="i-ip4">&mdash;</span></div>
  <div class="row"><span class="k">IPv6 address</span><span class="val" id="i-ip6">&mdash;</span></div>
  <div class="row"><span class="k">Region</span><span class="val" id="i-reg">&mdash;</span></div>
</div>
<script>
(function(){
  var START0=1123.19, ARC=1466.38, PERIM=1726.38;
  function pointAt(s){ s=((s%PERIM)+PERIM)%PERIM;
    if(s<260)return[196+s,4];
    if(s<863.19){var t=(s-260)/192;return[456+192*Math.sin(t),196-192*Math.cos(t)];}
    if(s<1123.19)return[456-(s-863.19),388];
    var t=(s-1123.19)/192;return[196-192*Math.sin(t),196+192*Math.cos(t)]; }
  function arcD(frac){ var L=ARC*Math.max(0,Math.min(1,frac)); if(L<0.5)L=0.5;
    var p=pointAt(START0),d='M'+p[0].toFixed(1)+' '+p[1].toFixed(1);
    for(var x=3;x<=L;x+=3){p=pointAt(START0+x);d+='L'+p[0].toFixed(1)+' '+p[1].toFixed(1);}
    p=pointAt(START0+L);d+='L'+p[0].toFixed(1)+' '+p[1].toFixed(1);return d; }
  function logFrac(v){ if(v<=0)return 0; var f=(v<=100)?0.5*Math.log10(v+1)/Math.log10(101):0.5+0.5*(Math.log10(v)-2); return Math.max(0,Math.min(1,f)); }

  var qs=new URLSearchParams(location.search);
  var th=qs.get('theme'); if(th)document.documentElement.setAttribute('data-theme',th);
  var demo=location.protocol==='file:'||qs.get('demo')==='1';
  var engine=qs.get('engine')||'yandex';
  var $=function(id){return document.getElementById(id);};
  var ind=$('ind'),go=$('go'),num=$('num'),phase=$('phase'),restart=$('restart'),server=$('server');
  var busy=false;

  function setArc(f){ ind.setAttribute('d',arcD(f)); }
  function setNum(v){ num.innerHTML=(typeof v==='number'?(v<100?v.toFixed(1):Math.round(v)):v)+'<small> Mbps</small>'; }
  function setPhase(t){ phase.textContent=t||''; }
  function showAlert(m,t){ var a=$('alert'); a.textContent=m; a.className='s-alert show '+(t||'danger'); }
  function hideAlert(){ $('alert').className='s-alert'; }
  function setRes(id,v){ var e=$('rv-'+id); if(e)e.textContent=v; }
  function showResult(){ num.style.display='none'; phase.style.display='none'; var r=$('result'); if(r)r.classList.add('show'); }
  function hideResult(){ var r=$('result'); if(r)r.classList.remove('show'); num.style.display='block'; phase.style.display=''; }
  function finish(dl,ul,pg){ setRes('dl',(dl<100?dl.toFixed(1):Math.round(dl))); setRes('ul',(ul<100?ul.toFixed(1):Math.round(ul))); setRes('pg',pg); setArc(logFrac(dl)); showResult(); restart.style.display='inline-block'; }
  function on(id){ ['pg','dl','ul'].forEach(function(x){$('r-'+x).classList.toggle('on',x===id);}); }
  function read(id,val,unit){ $('v-'+id).innerHTML=val+(unit?'<small> '+unit+'</small>':''); }
  function delay(ms){ return new Promise(function(r){setTimeout(r,ms);}); }

  // ---- browser-side measurement (Yandex's own method) ----
  function getProbes(){ return fetch('/cgi-bin/internetometer.cgi?action=probes',{cache:'no-store'}).then(function(r){return r.json();}); }
  function hostOf(u){ try{return new URL(u).host;}catch(e){return '';} }
  function dlUrls(p){ return p.download.probes.filter(function(x){return x.url.indexOf('50mb')>=0;}).map(function(x){return x.url;}); }

  function ping(p){
    var url=p.latency.probes[0].url, min=1e9, i=0;
    function step(){ if(i>=5)return Promise.resolve(Math.round(min)); var t=performance.now();
      return fetch(url,{cache:'no-store',mode:'cors'}).then(function(){var d=performance.now()-t;if(d<min)min=d;}).catch(function(){}).then(function(){i++;return step();}); }
    return step();
  }
  function download(p,onSpeed){
    var urls=dlUrls(p).slice(0,3); if(!urls.length)return Promise.resolve(0);
    var bytes=0,t0=performance.now(),last=0,lastT=t0;
    var ctrl=new AbortController(); var stop=setTimeout(function(){ctrl.abort();},10000);
    var si=setInterval(function(){var now=performance.now();var inst=(bytes-last)*8/((now-lastT)/1000)/1e6;last=bytes;lastT=now;onSpeed(inst);},200);
    function pull(u){ return fetch(u,{signal:ctrl.signal,cache:'no-store'}).then(function(r){var rd=r.body.getReader();
      function loop(){return rd.read().then(function(res){if(res.done)return;bytes+=res.value.length;return loop();});} return loop();}).catch(function(){}); }
    return Promise.all(urls.map(pull)).then(function(){clearTimeout(stop);clearInterval(si);
      var secs=(performance.now()-t0)/1000; return bytes*8/secs/1e6; });
  }
  function upload(p,onSpeed){
    return new Promise(function(res){
      var up=p.upload.probes[0]; if(!up){res(0);return;}
      var SIZE=8*1024*1024, url=up.url.replace(/&size=.*/,'')+'&size='+SIZE;
      var body=new Uint8Array(SIZE);
      // No Content-Type header -> CORS "simple request" (no preflight); CDN sends ACAO:*
      var xhr=new XMLHttpRequest(); xhr.open('POST',url);
      var t0=performance.now(),last=0,lastT=t0;
      xhr.upload.onprogress=function(e){var now=performance.now();if(now-lastT<150)return;var inst=(e.loaded-last)*8/((now-lastT)/1000)/1e6;last=e.loaded;lastT=now;onSpeed(inst);};
      xhr.onload=function(){var secs=(performance.now()-t0)/1000;res(SIZE*8/secs/1e6);};
      xhr.onerror=function(){res(0);}; xhr.ontimeout=function(){res(0);}; xhr.timeout=20000;
      xhr.send(body);
    });
  }

  // ---- demo (file:// preview): fake live ramp ----
  function demoRamp(target,onSpeed){ return new Promise(function(res){var v=0,k=0;var t=setInterval(function(){k++;v=target*(1-Math.exp(-k/8))+(Math.random()-0.5)*target*0.06;onSpeed(Math.max(0,v));if(k>=26){clearInterval(t);res(target);}},90);}); }

  // ---- user-data block ----
  function uaName(){ var u=navigator.userAgent,m;
    if((m=u.match(/Firefox\/([\d.]+)/)))return 'Firefox '+m[1];
    if((m=u.match(/Edg\/([\d.]+)/)))return 'Edge '+m[1];
    if((m=u.match(/Chrome\/([\d.]+)/)))return 'Chrome '+m[1];
    if((m=u.match(/Version\/([\d.]+).*Safari/)))return 'Safari '+m[1];
    return u.slice(0,40); }
  function loadUserInfo(){
    if(demo){ $('i-ip4').textContent='91.78.21.105'; $('i-reg').textContent='Moscow'; return; }
    if(engine==='ookla') return;   // Ookla fills IPv4/ISP from its own result (poll)
    fetch('/cgi-bin/internetometer.cgi?action=ip',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){if(d.ip)$('i-ip4').textContent=d.ip;}).catch(function(){});
    fetch('/cgi-bin/internetometer.cgi?action=region',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){if(d.name)$('i-reg').textContent=d.name;}).catch(function(){});
  }

  function reset(){ go.style.display='';num.style.display='none';setArc(0);setNum(0);setPhase('');on(null);
    ['pg','dl','ul'].forEach(function(x){$('v-'+x).innerHTML='&mdash;';});server.textContent='';restart.style.display='none'; }

  // Both engines measure on the ROUTER and stream live progress via polling
  // (webs can't stream). Интернетометр -> internetometer.cgi (Yandex CDN, works
  // without VPN); Speedtest -> speedtest_cli.cgi (Ookla, via VPN).
  function run(){
    if(busy)return; busy=true;
    go.disabled=true;go.style.display='none';hideResult();num.style.display='block';restart.style.display='none';
    setArc(0);setNum(0);setPhase('Connecting…');server.textContent='';hideAlert();
    if(demo){ return runDemo(); }
    return runEngine(engine==='ookla' ? 'speedtest_cli.cgi' : 'internetometer.cgi');
  }

  function runEngine(cgi){
    setPhase('Starting…');
    return fetch('/cgi-bin/'+cgi+'?action=start',{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(r){ if(!r||!r.ok)throw new Error((r&&r.error)||'Failed to start'); return pollEngine(cgi); })
      .catch(function(e){ setPhase('');setNum('—');showAlert(e.message||'Measurement failed','danger');restart.style.display='inline-block'; })
      .then(function(){ busy=false; });
  }
  function pollEngine(cgi){
    return new Promise(function(resolve,reject){
      var tries=0;
      var iv=setInterval(function(){
        if(++tries>240){ clearInterval(iv); reject(new Error('Timed out')); return; }
        fetch('/cgi-bin/'+cgi+'?action=poll',{cache:'no-store'}).then(function(r){return r.json();}).then(function(s){
          if(!s) return;
          if(!s.ok){ clearInterval(iv); reject(new Error(s.error||'Measurement failed')); return; }
          if(s.ip) $('i-ip4').textContent=s.ip;
          var loc=s.region||s.isp; if(loc) $('i-reg').textContent=loc;
          if(s.server) server.innerHTML='Server: <b>'+s.server+'</b>';
          if(s.stage==='download'){ setPhase('Download'); setNum(+s.download_mbps||0); setArc(logFrac(+s.download_mbps||0)); }
          else if(s.stage==='upload'){ setPhase('Upload'); setNum(+s.upload_mbps||0); setArc(logFrac(+s.upload_mbps||0)); }
          else if(s.stage==='ping'){ setPhase('Ping'); }
          if(s.done){ clearInterval(iv); finish(+s.download_mbps||0, +s.upload_mbps||0, +s.ping_ms||0); resolve(); }
        }).catch(function(){});
      }, 400);
    });
  }
  function runDemo(){
    $('i-ip4').textContent='91.78.21.105'; $('i-reg').textContent='Moscow';
    server.innerHTML='Server: <b>cloudcdn-mar-70.cdn.yandex.net</b>';
    var cb=function(s){setNum(s);setArc(logFrac(s));};
    setPhase('Ping');
    return delay(500).then(function(){ setPhase('Download'); return demoRamp(86.5,cb); })
      .then(function(){ setPhase('Upload'); return demoRamp(18.2,cb); })
      .then(function(){ finish(86.5,18.2,24); })
      .then(function(){ busy=false; });
  }

  go.addEventListener('click',run); restart.addEventListener('click',run);
  loadUserInfo();
})();
</script>
