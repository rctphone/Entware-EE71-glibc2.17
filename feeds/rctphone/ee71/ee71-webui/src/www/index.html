    <!-- Status bar (top, always visible when logged in) -->
    <header id="status-bar" class="hidden">
        <div class="status-group">
            <!-- Hamburger menu (mobile only) -->
            <button id="sb-hamburger" title="Menu"><svg><use href="#ic-menu"/></svg></button>
            <!-- Device name + model (left side) -->
            <span class="status-item" id="sb-device" title="Device">
                <strong id="sb-dev-name">EE71</strong>
                <span class="text-muted text-small" id="sb-dev-extra"></span>
            </span>
        </div>

        <div class="status-group">
            <!-- Signal bars -->
            <span class="status-item" id="sb-signal" title="Signal strength">
                <span class="signal-bars">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </span>
            </span>

            <!-- Network type -->
            <span class="status-item" title="Network type">
                <strong id="sb-tech">&mdash;</strong>
            </span>

            <!-- Internet -->
            <span class="status-item sb-dim" id="sb-inet" title="Internet">
                <svg><use href="#ic-globe"/></svg>
            </span>

            <!-- WiFi -->
            <span class="status-item sb-dim" id="sb-wifi" title="WiFi">
                <svg><use href="#ic-wifi"/></svg>
            </span>

            <!-- SMS (hidden until unread > 0) -->
            <span class="status-item hidden" id="sb-sms" title="Unread SMS">
                <svg><use href="#ic-envelope"/></svg>
                <span class="badge" id="sb-sms-count">0</span>
            </span>

            <!-- VPN -->
            <span class="status-item status-vpn hidden" id="sb-vpn" title="VPN active">
                <svg><use href="#ic-lock"/></svg>
            </span>

            <!-- Battery -->
            <span class="status-item" id="sb-battery" title="Battery">
                <svg class="battery-svg" viewBox="0 0 32 16">
                    <rect x="1" y="1" width="24" height="14" rx="2.5" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <rect id="sb-bat-fill" x="2.5" y="2.5" width="0" height="11" rx="1.5" fill="currentColor"/>
                    <rect x="26" y="4" width="3" height="8" rx="1.5" fill="currentColor"/>
                </svg>
                <span class="battery-level">&mdash;</span>
            </span>

            <!-- Theme toggle -->
            <button id="theme-toggle" title="Toggle theme">
                <svg><use href="#ic-moon"/></svg>
            </button>
        </div>
    </header>

    <!-- App container -->
    <div id="app-container">
        <div id="app-body">
            <!-- Sidebar navigation (desktop) -->
            <nav id="sidebar" class="hidden"></nav>

            <!-- Main content -->
            <main id="page-content">
                <div class="page-loading"><div class="spinner"></div> Loading...</div>
            </main>
        </div>
    </div>

    <!-- Bottom navigation (mobile) -->
    <nav id="bottom-nav" class="hidden">
        <div class="nav-scroll"></div>
    </nav>

    <!-- Mobile menu overlay -->
    <div id="mobile-menu" class="hidden">
        <div class="mobile-menu-header">
            <button id="mobile-menu-close" title="Close menu"><svg><use href="#ic-close"/></svg></button>
            <span class="mobile-menu-title">EE71</span>
        </div>
        <div class="mobile-menu-content"></div>
    </div>
